# Node.js 22.12 이상이 없을 때의 대안 실행 경로입니다. 기본 실행 방법은 README의 `npm run dev`입니다.
#
#   docker compose up --build
#
# - 웹: http://localhost:4173   (빌드 결과물을 vite preview로 서빙, /api는 api 서비스로 프록시)
# - API: http://localhost:3000/api, 문서: http://localhost:3000/api/docs
#
# vite preview는 운영용 서버가 아닙니다. 실제 배포에서는 정적 파일을 nginx·CDN이 서빙하고
# /api만 API 서버로 보내는 리버스 프록시를 둡니다. 여기서는 이미지 하나로 평가 환경을 재현하는 것이 목적입니다.

services:
  api:
    build: .
    image: study-room:local
    working_dir: /app/apps/api
    # migrate deploy와 시드는 반복 실행에 안전하므로 매 기동마다 실행합니다 (데이터가 있으면 시드는 건너뜀).
    command: ['sh', '-c', 'npm run db:setup && node dist/main.js']
    environment:
      DATABASE_URL: file:/data/dev.db
    volumes:
      - db-data:/data
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  web:
    build: .
    image: study-room:local
    working_dir: /app/apps/web
    command: ['npx', 'vite', 'preview', '--host', '0.0.0.0', '--port', '4173', '--strictPort']
    environment:
      # vite.config.ts의 프록시 대상. 컨테이너 안에서 localhost는 web 자신이므로 서비스 이름으로 지정합니다.
      VITE_API_TARGET: http://api:3000
    ports:
      - '4173:4173'
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
